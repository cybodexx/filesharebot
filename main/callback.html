<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signing in...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .callback-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .callback-card {
            background: var(--glass-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 48px 40px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .cb-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 24px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .cb-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 8px; }
        .cb-sub { color: var(--text-secondary); font-size: 0.9rem; }
        .cb-error { color: #ff4d4d; margin-top: 16px; }
    </style>
</head>
<body>
<div class="callback-wrap">
    <div class="callback-card glass-strong">
        <div class="cb-spinner" id="spinner"></div>
        <p class="cb-title" id="title">Completing sign-in…</p>
        <p class="cb-sub" id="sub">Please wait while we log you in.</p>
    </div>
</div>
<script>
(async function () {
    function getFragment() {
        const hash = window.location.hash.substring(1);
        const params = {};
        hash.split('&').forEach(part => {
            const [k, v] = part.split('=');
            if (k) params[decodeURIComponent(k)] = decodeURIComponent(v || '');
        });
        return params;
    }

    function getQuery() {
        const params = {};
        new URLSearchParams(window.location.search).forEach((v, k) => { params[k] = v; });
        return params;
    }

    function showError(msg) {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('title').textContent = 'Sign-in failed';
        document.getElementById('sub').textContent = '';
        const div = document.createElement('p');
        div.className = 'cb-error';
        div.textContent = msg;
        document.querySelector('.callback-card').appendChild(div);
        setTimeout(() => { window.location.href = '/auth/login'; }, 3000);
    }

    try {
        const frag = getFragment();
        const query = getQuery();

        const accessToken = frag.access_token || query.access_token;
        const refreshToken = frag.refresh_token || query.refresh_token;

        if (!accessToken) {
            const error = frag.error_description || query.error || 'No token received from provider.';
            showError(error);
            return;
        }

        const resp = await fetch('/auth/set-session', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ access_token: accessToken, refresh_token: refreshToken || '' })
        });

        const data = await resp.json();
        if (data.success) {
            document.getElementById('title').textContent = 'Signed in!';
            document.getElementById('sub').textContent = 'Redirecting to your dashboard…';
            window.location.href = data.redirect || '/my/dashboard';
        } else {
            showError(data.error || 'Authentication failed.');
        }
    } catch (e) {
        showError('An unexpected error occurred: ' + e.message);
    }
})();
</script>
</body>
</html>
