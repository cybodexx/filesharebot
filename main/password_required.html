{% extends "base.html" %}

{% block title %}Password Required - {{ config.NAME }}{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 60px auto;">
    <div class="glass-strong password-form" style="position: relative; padding: 50px;">
        <div class="password-icon">
            <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        </div>
        
        <h2 style="text-align: center; margin-bottom: 10px;">Password Protected</h2>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 30px;">
            This {{ 'file' if file_code else 'playlist' }} is protected. Enter the password to access it.
        </p>
        
        <form method="POST" action="">
            <div class="option-group" style="margin-bottom: 20px;">
                <input type="password" class="option-input" name="password" placeholder="Enter password" required autofocus style="width: 100%;">
            </div>
            
            {% if error %}
            <div style="background: rgba(255, 51, 102, 0.1); border: 1px solid var(--danger); border-radius: 10px; padding: 12px; margin-bottom: 20px; color: var(--danger); text-align: center;">
                {{ error }}
            </div>
            {% endif %}
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">
                <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM12 17c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
                Unlock
            </button>
        </form>
        
        <a href="/" style="display: block; text-align: center; color: var(--text-muted); margin-top: 20px; text-decoration: none;">
            Back to Home
        </a>
    </div>
</div>
{% endblock %}
